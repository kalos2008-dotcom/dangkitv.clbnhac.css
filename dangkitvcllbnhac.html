<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký thành viên ban nhạc</title>
  <link rel="stylesheet" href="DangKyThanhVien.css">
</head>
<body>

  <form name="frmDangKy" method="post" action="#">
    <table width="500" border="1" cellpadding="4" cellspacing="0">
      <caption>ĐĂNG KÝ THÀNH VIÊN CLB YÊU NHẠC</caption>

      <tr>
        <td class="nhan">Họ tên</td>
        <td><input type="text" id="txtHoTen" name="txtHoTen" required></td>
      </tr>

      <tr>
        <td class="nhan">Tên đăng nhập</td>
        <td><input type="text" id="txtTenDN" name="txtTenDN" required></td>
      </tr>

      <tr>
        <td class="nhan">Mật khẩu</td>
        <td><input type="password" id="txtMatKhau" name="txtMatKhau" required></td>
      </tr>

      <tr>
        <td class="nhan">Gõ lại mật khẩu</td>
        <td><input type="password" id="txtNhapLaiMK" name="txtNhapLaiMK" required></td>
      </tr>

      <tr>
        <td class="nhan">Giới tính</td>
        <td>
          <label><input type="radio" name="radGioiTinh" value="Nam"> Nam</label>
          <label><input type="radio" name="radGioiTinh" value="Nữ"> Nữ</label>
        </td>
      </tr>

      <tr>
        <td class="nhan">Ngoại ngữ</td>
        <td>
          <label><input type="checkbox" name="chkNN[]" value="Anh"> Anh</label>
          <label><input type="checkbox" name="chkNN[]" value="Pháp"> Pháp</label>
          <label><input type="checkbox" name="chkNN[]" value="Nhật"> Nhật</label>
        </td>
      </tr>

      <tr>
        <td class="nhan">Nghề nghiệp</td>
        <td>
          <select name="cboNgheNghiep">
            <option value="">-- Chọn nghề nghiệp --</option>
            <option value="Sinh viên">Sinh viên</option>
            <option value="Nhạc công / Ca sĩ">Nhạc công / Ca sĩ</option>
            <option value="Kỹ thuật viên âm thanh">Kỹ thuật viên âm thanh</option>
            <option value="Khác">Khác</option>
          </select>
        </td>
      </tr>

      <tr>
        <td class="nhan">Vị trí / Nhạc cụ</td>
        <td>
          <select name="cboViTriBanNhac">
            <option value="Vocal (Hát)">Vocal (Hát)</option>
            <option value="Guitar">Guitar</option>
            <option value="Bass">Bass</option>
            <option value="Drum (Trống)">Drum (Trống)</option>
            <option value="Keyboard / Piano">Keyboard / Piano</option>
          </select>
        </td>
      </tr>

      <tr>
        <td class="nhan">Hình</td>
        <td><input type="file" id="flHinh" name="flHinh" accept="image/*"></td>
      </tr>

      <tr>
        <td class="nhan">Sở thích</td>
        <td>
          <label><input type="checkbox" name="chkST[]" value="Rock/Pop"> Rock/Pop</label>
          <label><input type="checkbox" name="chkST[]" value="Acoustic"> Acoustic</label>
          <label><input type="checkbox" name="chkST[]" value="Sáng tác"> Sáng tác</label>
        </td>
      </tr>

      <tr>
        <td colspan="2" class="nut-bam">
          <button type="submit">Đăng ký</button>
          <button type="reset">Làm lại</button>
        </td>
      </tr>
    </table>
  </form>

</body>
</html>
